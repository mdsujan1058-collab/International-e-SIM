name: Build Signed Release APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Files
        run: |
          mkdir -p www
          unzip -o www.zip -d www
      - name: Initialize Capacitor & Build Signed APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "International eSIM" "com.international.esim" --web-dir=www
          npx cap add android
          npx cap sync
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/release-key.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias esimkey -storepass 123456 -keypass 123456 -dname "CN=International eSIM, OU=App, O=eSIM, L=Dhaka, S=Dhaka, C=BD"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-key.jks" -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=esimkey -Pandroid.injected.signing.key.password=123456
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: International-eSIM-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
